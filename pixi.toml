[workspace]
name = "level-up-your-python"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
ipykernel = ">=6.0"
jupyter-book = ">=2"
jupyterlab = ">=3"
line_profiler = "*"
matplotlib  = ">=3.10"
mypy = ">=1"
numba = ">=0.55"
numpy = ">=2"
pandas = ">=1.3"
pytest = ">=9"
pytest-mock = "*"
python = ">=3.12"
rich = ">=11"

[tasks]
lab = "jupyter lab"
book = "jupyter book build --execute --html"
book-ci = "jupyter book build --execute --ci --html"
pdf = "jupyter book build --pdf --execute"
